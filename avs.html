<!doctype html>
<html lang="ro">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Voice Halo — AVS</title>
<style>
  :root {
    --ink: #cfd6de; --dim: #7f8894; --line: #1d242d;
    --pad-b: env(safe-area-inset-bottom, 0px);
    --pad-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #05070a; color: var(--dim);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0 }

  #ui { position: fixed; inset: 0; display: flex; flex-direction: column;
        justify-content: space-between; padding: calc(var(--pad-t) + 10px) 10px
        calc(var(--pad-b) + 8px); transition: opacity .35s; z-index: 3; pointer-events: none }
  #ui.faded { opacity: 0 }
  #ui > * { pointer-events: auto }

  #top { display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
  .chip { flex: 0 0 auto; padding: 9px 12px; border-radius: 999px;
          border: 1px solid var(--line); background: rgba(10,14,19,.72); color: var(--dim);
          font: 600 13px/1 ui-monospace, monospace; backdrop-filter: blur(8px) }
  .chip.on { border-color: #3c7fa6; color: #bfe6ff; background: rgba(20,44,60,.8) }
  a.chip { text-decoration: none }

  #name { font: 600 14px/1.3 ui-monospace, monospace; color: var(--ink);
          text-shadow: 0 1px 6px #000; margin-bottom: 2px }
  #pack { font-size: 11px; color: var(--dim); text-shadow: 0 1px 6px #000 }
  #err  { font-size: 11px; color: #d88; margin-top: 4px; text-shadow: 0 1px 6px #000 }

  #sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 62vh; overflow: auto;
           background: rgba(5,8,12,.94); border-top: 1px solid var(--line);
           backdrop-filter: blur(10px); transform: translateY(100%);
           transition: transform .28s; z-index: 4;
           padding: 10px 10px calc(var(--pad-b) + 12px) }
  #sheet.open { transform: none }
  .row { display: block; width: 100%; text-align: left; padding: 10px 11px; margin-bottom: 6px;
         border: 1px solid var(--line); border-radius: 10px; background: rgba(12,17,23,.8);
         color: var(--ink); font: 13px/1.35 inherit }
  .row.sel { border-color: #3c7fa6; background: rgba(20,44,60,.7) }
  .row .p { font-size: 11px; color: var(--dim); margin-top: 3px }
  .tag { display: inline-block; font: 600 9.5px/1.6 ui-monospace, monospace; padding: 0 6px;
         border-radius: 999px; border: 1px solid var(--line); color: var(--dim); margin-right: 5px }
  .tag.ex { border-color: #1d3a4a; color: #7cf }
  #filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px }
  pre { font: 11px/1.45 ui-monospace, monospace; background: #080b10; border: 1px solid var(--line);
        border-radius: 8px; padding: 9px; overflow: auto; max-height: 30vh; color: #cdd6e0; margin: 6px 0 0 }
  pre b { color: #7ee6a8 }
</style>

<canvas id="cv"></canvas>

<div id="ui">
  <div id="top">
    <button class="chip on" id="mic">microfon</button>
    <button class="chip" id="synth">ton</button>
    <button class="chip" id="prev">‹</button>
    <button class="chip" id="next">›</button>
    <button class="chip" id="pick">listă</button>
    <a class="chip" href="./">halo</a>
    <a class="chip" href="galerie.html">galerie</a>
  </div>
  <div>
    <div id="name">—</div>
    <div id="pack"></div>
    <div id="err"></div>
  </div>
</div>

<div id="sheet">
  <div id="filters">
    <button class="chip on f" data-f="*">toate</button>
    <button class="chip f" data-f="exact">spectru circular</button>
    <button class="chip f" data-f="green">verde</button>
    <button class="chip" id="close">închide</button>
  </div>
  <div id="rows"></div>
  <pre id="code"></pre>
</div>

<script src="avs/webvs-loader.js"></script>
<script>
const $ = s => document.querySelector(s);
let data = [], cur = -1, webvs = null, analyser = null, actx = null, synthNode = null, filt = '*';

function fit() {
  const c = $('#cv'), d = Math.min(window.devicePixelRatio || 1, 2);
  c.width = Math.round(innerWidth * d); c.height = Math.round(innerHeight * d);
  if (webvs) webvs.notifyResize();
}
addEventListener('resize', fit);

function audio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = new Webvs.WebAudioAnalyser({ context: actx });
}

async function useMic() {
  audio(); await actx.resume();
  try {
    const s = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    if (synthNode) { synthNode.stop(); synthNode = null; }
    analyser.connectToNode(actx.createMediaStreamSource(s));
    mode('mic');
  } catch (e) { $('#err').textContent = 'microfon: ' + e.message; }
}

function useSynth() {
  // ton de rezervă, ca presetele să aibă ce citi fără microfon
  audio(); actx.resume();
  const out = actx.createGain(); out.gain.value = .8;
  const o1 = actx.createOscillator(), g1 = actx.createGain();
  o1.type = 'sine'; o1.frequency.value = 62; g1.gain.value = 0; o1.connect(g1).connect(out); o1.start();
  const o2 = actx.createOscillator(), g2 = actx.createGain(), lp = actx.createBiquadFilter();
  o2.type = 'sawtooth'; o2.frequency.value = 196; g2.gain.value = .07;
  lp.type = 'lowpass'; lp.frequency.value = 1100; o2.connect(lp).connect(g2).connect(out); o2.start();
  const nb = actx.createBuffer(1, actx.sampleRate, actx.sampleRate), d = nb.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * .5;
  const nz = actx.createBufferSource(); nz.buffer = nb; nz.loop = true;
  const ng = actx.createGain(), hp = actx.createBiquadFilter();
  ng.gain.value = 0; hp.type = 'highpass'; hp.frequency.value = 4500;
  nz.connect(hp).connect(ng).connect(out); nz.start();
  const notes = [196, 233, 174, 261], beat = 60 / 126;
  let k = 0;
  const t = setInterval(() => {
    const now = actx.currentTime;
    if (k % 2 === 0) { g1.gain.cancelScheduledValues(now); g1.gain.setValueAtTime(.9, now);
                       g1.gain.exponentialRampToValueAtTime(.01, now + beat * .9); }
    ng.gain.cancelScheduledValues(now); ng.gain.setValueAtTime(.3, now);
    ng.gain.exponentialRampToValueAtTime(.001, now + beat * .35);
    if (k % 8 === 0) { o2.frequency.setValueAtTime(notes[(k / 8) % 4 | 0], now);
                       lp.frequency.setValueAtTime(700 + Math.random() * 2000, now); }
    k++;
  }, beat * 1000);
  if (synthNode) synthNode.stop();
  synthNode = { stop() { clearInterval(t); try { o1.stop(); o2.stop(); nz.stop(); } catch (e) {} } };
  analyser.connectToNode(out);
  mode('synth');
}
function mode(m) { $('#mic').classList.toggle('on', m === 'mic'); $('#synth').classList.toggle('on', m === 'synth'); }

function hi(lines) {
  return lines.map(l => l.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))
    .replace(/(getspec\s*\([^)]*\))/gi, '<b>$1</b>')
    .replace(/\b(s\s*=\s*1\s*-\s*s|bnot\([^)]*\))/gi, '<b>$1</b>')).join('\n');
}

async function play(i) {
  const m = data[i]; if (!m) return;
  cur = i;
  $('#name').textContent = m.name;
  $('#pack').textContent = m.pack;
  $('#err').textContent = '';
  $('#code').innerHTML = hi(m.code);
  document.querySelectorAll('.row').forEach(el => el.classList.toggle('sel', +el.dataset.i === i));
  const j = await (await fetch('avs/presets/' + m.file)).json();
  if (!webvs) { audio(); webvs = new Webvs.Main({ canvas: $('#cv'), analyser, showStat: false }); webvs.start(); }
  try { webvs.loadPreset(j); } catch (e) { $('#err').textContent = 'nu rulează în webvs: ' + e.message; }
}

function rows() {
  const box = $('#rows'); box.innerHTML = '';
  data.forEach((m, i) => {
    if (filt === 'exact' && m.tier !== 'exact') return;
    if (filt === 'green' && !m.green) return;
    const b = document.createElement('button');
    b.className = 'row'; b.dataset.i = i;
    b.innerHTML = m.name.replace(/[<>]/g, '') + '<div class="p">'
      + (m.tier === 'exact' ? '<span class="tag ex">spectru circular</span>' : '<span class="tag">semnătură</span>')
      + m.pack.replace(/[<>]/g, '') + '</div>';
    b.onclick = () => { play(i); $('#sheet').classList.remove('open'); };
    box.appendChild(b);
  });
}

fit();
loadWebvs()
  .then(() => fetch('avs/data.json').then(r => r.json()))
  .then(d => {
    data = d; rows();
    $('#mic').onclick = useMic;
    $('#synth').onclick = useSynth;
    $('#prev').onclick = () => play(Math.max(0, cur - 1));
    $('#next').onclick = () => play(Math.min(data.length - 1, cur + 1));
    $('#pick').onclick = () => $('#sheet').classList.toggle('open');
    $('#close').onclick = () => $('#sheet').classList.remove('open');
    document.querySelectorAll('.f').forEach(b => b.onclick = () => {
      document.querySelectorAll('.f').forEach(x => x.classList.remove('on'));
      b.classList.add('on'); filt = b.dataset.f; rows();
    });
    play(0);
    // microfonul are nevoie de un gest; până atunci, tonul de rezervă
    document.body.addEventListener('click', function once() { if (!actx) useSynth(); }, { once: true });
  })
  .catch(e => { $('#err').textContent = 'webvs nu s-a încărcat: ' + e.message; });
</script>
