<!doctype html>
<html lang="ro">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Voice Halo</title>
<style>
  :root {
    --ink: #cfd6de; --dim: #7f8894; --line: #1d242d;
    --pad-b: env(safe-area-inset-bottom, 0px);
    --pad-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #05070a; color: var(--dim);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  body::before {                       /* fundal, ca să se vadă cum compune halo-ul */
    content: ""; position: fixed; inset: 0;
    background: radial-gradient(120vmax 90vmax at 30% 15%, #101b26, #05070a 70%);
  }
  /* pânza: centrată pe ecran, mai lată decât ecranul — vârfurile tari pot ieși afară */
  #wrap { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
          pointer-events: none; mix-blend-mode: screen }
  #wrap canvas { display: block }

  /* ── comenzi ─────────────────────────────────────────────────────────── */
  #ui { position: fixed; inset: 0; display: flex; flex-direction: column;
        justify-content: space-between; padding: calc(var(--pad-t) + 10px) 10px
        calc(var(--pad-b) + 8px); transition: opacity .35s; z-index: 3 }
  #ui.faded { opacity: 0 }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
  .chip { flex: 0 0 auto; min-width: 42px; padding: 9px 12px; border-radius: 999px;
          border: 1px solid var(--line); background: rgba(10,14,19,.72); color: var(--dim);
          font: 600 14px/1 ui-monospace, monospace; backdrop-filter: blur(8px) }
  .chip.on { border-color: #3c7fa6; color: #bfe6ff; background: rgba(20,44,60,.8) }
  /* favoritele lui Victor: 5 (spițe pe spectru) și 7 (MilkDrop autentic) */
  .chip.fav::after { content: "★"; font-size: 9px; vertical-align: super; opacity: .75 }
  #bottom { display: flex; flex-direction: column; gap: 8px; align-items: center }
  #label { color: var(--ink); font-size: 12px; text-align: center; padding: 0 8px;
           text-shadow: 0 1px 6px #000 }
  #mic { padding: 13px 20px; border-radius: 999px; border: 1px solid #2f6b8c;
         background: rgba(16,40,56,.85); color: #bfe6ff; font: 600 15px/1 inherit;
         backdrop-filter: blur(8px) }
  #mic.live { border-color: var(--line); background: rgba(10,14,19,.6); color: var(--dim);
              font-weight: 400; font-size: 12px; padding: 7px 14px }
  #mic.bad { border-color: #7a3a33; color: #ff9b8a }
  /* vumetru: o bară per interval de frecvență, grave la stânga, înalte la dreapta */
  #bars { display: flex; align-items: flex-end; gap: 2px; width: 100%; height: 46px }
  #bars div { flex: 1; min-height: 2px; border-radius: 2px 2px 0 0;
              background: linear-gradient(#7fe3ff, #23566f) }
</style>

<div id="wrap"><canvas id="c"></canvas></div>

<div id="ui">
  <div id="chips"></div>
  <div id="bottom">
    <div id="label">apasă pe buton ca să pornești microfonul</div>
    <button id="mic">🎙 pornește microfonul</button>
    <div id="bars"></div>
  </div>
</div>

<script>
// ─────────────────────────────── audio ────────────────────────────────
// Pe telefon getUserMedia cere DOUĂ lucruri: origine https (de aici GitHub Pages)
// și un gest al utilizatorului. iOS mai cere și un actx.resume() în acel gest,
// altfel contextul rămâne suspendat și forma de undă e numai zerouri.
const actx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = actx.createAnalyser();
analyser.fftSize = 2048;
analyser.smoothingTimeConstant = 0.72;
const wave = new Float32Array(analyser.fftSize);
const spec = new Uint8Array(analyser.frequencyBinCount);
let micOn = false;

const micBtn = document.getElementById('mic');
const label  = document.getElementById('label');

async function startMic() {
  if (micOn) return;
  try {
    if (!navigator.mediaDevices) throw new Error('fără mediaDevices (pagina nu e pe https?)');
    await actx.resume();
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
    });
    actx.createMediaStreamSource(stream).connect(analyser);
    micOn = true;
    micBtn.className = 'live';
    micBtn.textContent = '🎙 microfon pornit';
    label.textContent = (fIdx + 1) + ' — ' + FORMULAS[fIdx].name;
    keepAwake();
  } catch (e) {
    micBtn.className = 'bad';
    micBtn.textContent = 'microfon refuzat: ' + (e.name || e.message);
  }
}
micBtn.addEventListener('click', startMic);

// ecranul să nu se stingă cât te uiți la el
async function keepAwake() {
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && micOn) keepAwake();
});

// ── vumetrul: se vede imediat când intră vocea ────────────────────────
const BARS = 36, barEls = [];
{
  const box = document.getElementById('bars');
  for (let i = 0; i < BARS; i++) { const d = document.createElement('div'); box.append(d); barEls.push(d); }
}
function drawBars() {
  // vocea stă jos în spectru, deci benzile grave primesc mai multă lățime (scală pătratică)
  for (let i = 0; i < BARS; i++) {
    const lo = Math.floor(Math.pow(i / BARS, 2) * spec.length);
    const hi = Math.max(lo + 1, Math.floor(Math.pow((i + 1) / BARS, 2) * spec.length));
    let sum = 0; for (let j = lo; j < hi; j++) sum += spec[j];
    barEls[i].style.height = (2 + (sum / (hi - lo) / 255) * 42) + 'px';
  }
}

// ──────────────────────── geometrie / layout ──────────────────────────
// Cerința: cercul de repaus să aibă diametrul = 80% din LĂȚIMEA ecranului.
// Fiecare formulă își desenează inelul la o fracțiune proprie din R (0.42…0.58),
// așa că R nu e „jumătate de ecran": îl calculăm din fracțiunea formulei curente,
// ca toate cele șapte să iasă la același diametru vizibil.
const RING_OF_WIDTH = 0.80;
const canvas = document.getElementById('c');
const lctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
const dpr = Math.min(2, window.devicePixelRatio || 1);   // 2 e destul; 3 doar încinge telefonul
let R = 150;

const fb = [0, 1].map(() => { const c = document.createElement('canvas'); return { c, x: c.getContext('2d') }; });
let fbCur = 0;

function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const wanted = RING_OF_WIDTH * Math.min(vw, vh * 0.92) / 2;   // raza cerută, în px
  R = wanted / FORMULAS[fIdx].rest;                             // deci jumătatea pânzei
  const side = Math.round(R * 2), px = Math.round(side * dpr);
  canvas.style.width = canvas.style.height = side + 'px';
  canvas.width = canvas.height = px;
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  wrap.style.width = wrap.style.height = side + 'px';
  for (const f of fb) { f.c.width = f.c.height = px; }
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 250));

// ─────────────── formulele: desenate în coordonate centrate ───────────
// v(i) = eșantionul de undă în [-1,1]; s(i) = spectrul în [0,1].
const v = i => wave[(i * (wave.length - 1)) | 0] || 0;
const s = i => (spec[(i * (spec.length * 0.55)) | 0] || 0) / 255;

function strokePath(pts, close, hue, width, alpha) {
  lctx.beginPath();
  pts.forEach(([x, y], k) => k ? lctx.lineTo(x, y) : lctx.moveTo(x, y));
  if (close) lctx.closePath();
  lctx.lineWidth = width; lctx.lineJoin = 'round'; lctx.lineCap = 'round';
  lctx.strokeStyle = `hsla(${hue % 360}, 85%, 62%, ${alpha})`;
  lctx.shadowColor = `hsla(${hue % 360}, 95%, 60%, .9)`;
  lctx.shadowBlur = width * 5;
  lctx.stroke();
}

// `rest` = unde stă marginea VIZIBILĂ a efectului, ca fracțiune din R. Pânza se
// scalează din ea, ca toate să iasă la același diametru pe ecran.
//
// Două reguli pe care le respectă tot grupul, cerute de Victor:
//   · centrul rămâne LIBER — nimic nu intră spre mijloc, ca să poți suprapune ceva;
//   · linia pulsează DOAR SPRE EXTERIOR — mișcarea spre interior arăta amenințător.
// De aceea peste tot se folosește |eșantion|, nu eșantionul cu semn.

// ── benzi de spectru cu AGC per bandă ────────────────────────────────────────
// Fără asta, doar graveleaza se mișcă: benzile înalte sunt cu un ordin de mărime mai
// slabe, așa că spițele „roșii" abia se clinteau în timp ce „verdele" sărea. Fiecare
// bandă își ține propriul maxim recent și se raportează la el, deci toate ajung la 1.
const NB = 64;
const peak = new Float32Array(NB).fill(30);
const band = new Float32Array(NB);
function updateBands() {
  for (let i = 0; i < NB; i++) {
    const lo = Math.floor(Math.pow(i / NB, 2) * spec.length * 0.85);
    const hi = Math.max(lo + 1, Math.floor(Math.pow((i + 1) / NB, 2) * spec.length * 0.85));
    let sum = 0; for (let j = lo; j < hi; j++) sum += spec[j];
    const val = sum / (hi - lo);
    peak[i] = Math.max(val, peak[i] * 0.992);              // maximul recent se stinge lent
    band[i] = Math.max(0, (val - 7) / Math.max(16, peak[i] - 7));   // 7 = pragul de liniște
  }
}
const e = i => band[Math.min(NB - 1, Math.max(0, i | 0))] || 0;      // energia benzii i
const eAt = u => e(u * (NB - 1));                                    // … pe u ∈ [0,1]
const vAbs = i => Math.abs(v(i));                                    // puls doar spre exterior

// ── ceața: aceeași cale, trasă în afară și suflată larg ──────────────────────
function fogPath(pts, close, hue, width, alpha, push) {
  const k = 1 + (push || 0);
  lctx.beginPath();
  pts.forEach(([x, y], i) => i ? lctx.lineTo(x * k, y * k) : lctx.moveTo(x * k, y * k));
  if (close) lctx.closePath();
  lctx.lineWidth = width; lctx.lineJoin = lctx.lineCap = 'round';
  lctx.strokeStyle = `hsla(${hue % 360}, 80%, 62%, ${alpha})`;
  lctx.shadowColor = `hsla(${hue % 360}, 90%, 64%, .85)`;
  lctx.shadowBlur = width * 2.4;
  lctx.stroke();
  lctx.shadowBlur = 0;
}

// ── inelul MilkDrop, ca funcție (folosit de 2 și 3) ──────────────────────────
// Raza în punctul i = raza de repaus + |eșantionul PCM|; mănunchiul de fire e cadrul
// precedent redesenat mărit, rotit și stins. SEGS mic ⇒ poligon de sârmă, nu curbă.
function milkdropRing(t, { ZOOM, TWIST, DECAY, R0, AMP, W, SEGS = 512, HUE = null }) {
  const px = fb[0].c.width, half = px / 2;
  const src = fb[fbCur], dst = fb[1 - fbCur];

  dst.x.setTransform(1, 0, 0, 1, 0, 0);
  dst.x.globalCompositeOperation = 'source-over';
  dst.x.clearRect(0, 0, px, px);
  dst.x.save();
  dst.x.globalAlpha = DECAY;
  dst.x.translate(half, half); dst.x.rotate(TWIST); dst.x.scale(ZOOM, ZOOM);
  dst.x.drawImage(src.c, -half, -half, px, px);
  dst.x.restore();

  dst.x.globalCompositeOperation = 'lighter';
  dst.x.strokeStyle = HUE === null ? '#fff' : `hsl(${HUE % 360}, 85%, 70%)`;
  dst.x.lineJoin = dst.x.lineCap = 'round';
  dst.x.beginPath();
  for (let k = 0; k <= SEGS; k++) {
    const i = k / SEGS, th = i * Math.PI * 2 + t * 0.12;
    const seam = Math.max(0, (i - 0.9) / 0.1);           // ultimele 10% se întorc la
    const sample = vAbs(i) * (1 - seam) + vAbs(0) * seam; // primul, ca să nu rămână coardă
    const r = half * (R0 + AMP * sample);
    const x = half + Math.cos(th) * r, y = half + Math.sin(th) * r;
    k ? dst.x.lineTo(x, y) : dst.x.moveTo(x, y);
  }
  dst.x.closePath();
  dst.x.lineWidth = W * 7 * dpr;   dst.x.globalAlpha = 0.045; dst.x.stroke();  // ceața largă
  dst.x.lineWidth = W * 2.6 * dpr; dst.x.globalAlpha = 0.11;  dst.x.stroke();  // halo
  dst.x.lineWidth = W * dpr;       dst.x.globalAlpha = 0.85;  dst.x.stroke();  // firul
  dst.x.globalAlpha = 1;
  fbCur = 1 - fbCur;
  lctx.drawImage(fb[fbCur].c, -R, -R, R * 2, R * 2);
}

// ── ecouri emise pe bătaie (folosit de 6) ────────────────────────────────────
const echoes = [];
let beatAvg = 0, beatHold = 0;
function pumpEchoes(t) {
  let now = 0; for (let i = 0; i < NB; i++) now += band[i];
  now /= NB;
  beatAvg = beatAvg * 0.92 + now * 0.08;
  if (now > beatAvg * 1.45 && now > 0.10 && t - beatHold > 0.12) {
    echoes.push({ born: t, hue: 190 + Math.random() * 80 });
    beatHold = t;
  }
  while (echoes.length > 14) echoes.shift();
}

const FORMULAS = [
  { name: 'lanț de fulgere — arce zimțate, cu ceață în afară', rest: 0.72, draw(t) {
      // ca inelul din Walkie Talkie: arce scurte cu pauze, fiecare vârf împins în
      // AFARĂ de propriul eșantion. Ceața se desenează pe aceeași cale, dar trasă
      // cu 7% în exterior, ca să pară că emană din fulger spre margine.
      const M = 14, SEG = 9, r0 = R * 0.56;
      for (let m = 0; m < M; m++) {
        const a0 = (m / M) * Math.PI * 2 + t * 0.22;
        const span = (Math.PI * 2 / M) * 0.70;
        const pts = [];
        for (let k = 0; k <= SEG; k++) {
          const u = k / SEG, th = a0 + span * u;
          const j = vAbs((m * SEG + k) / (M * SEG));
          const r = r0 * (1 + 0.17 * j + 0.02 * Math.sin(t * 3.1 + m * 1.7));
          pts.push([Math.cos(th) * r, Math.sin(th) * r]);
        }
        const hue = 195 + m * 3 + t * 12;
        fogPath(pts, false, hue, 26, .035, 0.07);      // ceața, spre exterior
        fogPath(pts, false, hue, 12, .06,  0.03);
        strokePath(pts, false, hue, 1.7, .92);          // fulgerul
      }
  }},
  { name: 'MilkDrop strâns — puls doar spre exterior', rest: 0.66, draw(t) {
      milkdropRing(t, { ZOOM: 1.006, TWIST: 0.003, DECAY: 0.86, R0: 0.54, AMP: 0.20, W: 1.1 });
  }},
  { name: 'sârmă poligonală — buclă zimțată cu ecou', rest: 0.70, draw(t) {
      // „LuxXx – It Lives in Deep Space": aceeași mecanică, dar cu 30 de colțuri și
      // coarde drepte între ele — de aia citește ca SÂRMĂ, nu ca undă netedă.
      milkdropRing(t, { ZOOM: 1.009, TWIST: -0.004, DECAY: 0.89, R0: 0.52, AMP: 0.22,
                        W: 1.0, SEGS: 30, HUE: 205 });
  }},
  { name: 'spițe pe spectru — două semicercuri', rest: 0.78, draw(t) {
      // două semicercuri, nu unul singur; pauze la stânga și la dreapta. În liniște
      // spițele stau la o treime din lungimea de dinainte, deci inelul e aproape gol.
      const r0 = R * 0.46, GAP = 0.34, REST = 0.013;
      for (const side of [0, 1]) {
        for (let k = 0; k < NB; k++) {
          const u = k / (NB - 1);
          const th = (side ? Math.PI : 0) + GAP / 2 + u * (Math.PI - GAP) + t * 0.06;
          const en = Math.pow(e(k), 1.15);
          const len = R * (REST + 0.30 * en);
          const hue = 190 + u * 170 + t * 8;
          const a = [Math.cos(th) * r0, Math.sin(th) * r0];
          const b = [Math.cos(th) * (r0 + len), Math.sin(th) * (r0 + len)];
          if (en > 0.05) fogPath([a, b], false, hue, 9, .05 + .09 * en, 0);
          strokePath([a, b], false, hue, 2.0, .45 + .5 * en);
        }
      }
      const ring = [];
      for (let k = 0; k <= 180; k++) { const th = k / 180 * Math.PI * 2;
        ring.push([Math.cos(th) * r0, Math.sin(th) * r0]); }
      strokePath(ring, true, 200 + t * 8, 1, .30);
  }},
  { name: 'mesh — coarde încrucișate pe periferie', rest: 0.64, draw(t) {
      // câteva coarde, nu multe: unghiul dintre capete e ținut sub ~95°, deci coarda
      // trece pe la 0.66·r0 de centru în cel mai rău caz — nu intră niciodată în mijloc.
      const r0 = R * 0.56, M = 4;
      for (let m = 0; m < M; m++) {
        const en = Math.pow(eAt(0.08 + m * 0.22), 1.1);
        const a1 = t * 0.23 + m * (Math.PI * 2 / M);
        const spread = 1.05 + 0.55 * Math.sin(t * 0.5 + m * 1.3);     // ≤ 1.6 rad
        const a2 = a1 + spread;
        const A = [Math.cos(a1) * r0, Math.sin(a1) * r0];
        const B = [Math.cos(a2) * r0, Math.sin(a2) * r0];
        const pts = [];                                   // coarda, ondulată de voce
        const N = 24;
        for (let k = 0; k <= N; k++) {
          const u = k / N;
          const x = A[0] + (B[0] - A[0]) * u, y = A[1] + (B[1] - A[1]) * u;
          const nx = -(B[1] - A[1]), ny = (B[0] - A[0]);
          const nl = Math.hypot(nx, ny) || 1;
          const w = Math.sin(u * Math.PI) * R * 0.07 * v((m * N + k) / (M * N));
          pts.push([x + nx / nl * w, y + ny / nl * w]);
        }
        const hue = 186 + m * 26 + t * 10;
        fogPath(pts, false, hue, 16, .04 + .07 * en, 0);
        strokePath(pts, false, hue, 1.3 + 1.6 * en, .35 + .55 * en);
      }
      const ring = [];                                     // inelul care le leagă
      for (let k = 0; k <= 200; k++) { const th = k / 200 * Math.PI * 2;
        const r = r0 * (1 + 0.05 * vAbs(k / 200));
        ring.push([Math.cos(th) * r, Math.sin(th) * r]); }
      strokePath(ring, true, 200 + t * 9, 1.1, .45);
  }},
  { name: 'ecouri pe bătaie — inele care pleacă în afară', rest: 0.80, draw(t) {
      // ecoul din MilkDrop: la fiecare accent se naște un inel care se duce spre
      // margine și se stinge. Tot ce apare, apare în afară — centrul rămâne gol.
      pumpEchoes(t);
      const r0 = R * 0.42;
      for (const ec of echoes) {
        const age = t - ec.born;
        if (age > 2.6) continue;
        const k = age / 2.6;
        const r = r0 * (1 + 0.85 * k);
        const alpha = (1 - k) * (1 - k) * 0.85;
        const pts = [];
        for (let i = 0; i <= 160; i++) {
          const th = i / 160 * Math.PI * 2;
          const rr = r * (1 + 0.05 * vAbs(i / 160) * (1 - k));
          pts.push([Math.cos(th) * rr, Math.sin(th) * rr]);
        }
        fogPath(pts, true, ec.hue, 14, alpha * .10, 0);
        strokePath(pts, true, ec.hue, 1.4, alpha);
      }
      const base = [];
      for (let i = 0; i <= 200; i++) { const th = i / 200 * Math.PI * 2;
        base.push([Math.cos(th) * r0 * (1 + 0.06 * vAbs(i / 200)),
                   Math.sin(th) * r0 * (1 + 0.06 * vAbs(i / 200))]); }
      strokePath(base, true, 200 + t * 6, 1.6, .7);
  }},
  { name: 'inel dublu contrarotativ', rest: 0.66, draw(t) {
      // „Tripgnosis – Diggital" / „Rism – Circle": două bucle subțiri care se rotesc
      // în sensuri opuse, amândouă crescând doar în afară.
      for (const sgn of [1, -1]) {
        const N = 320, pts = [];
        const base = 0.50 + (sgn > 0 ? 0.045 : 0);
        for (let k = 0; k <= N; k++) {
          const i = k / N, th = i * Math.PI * 2 + sgn * t * 0.30;
          const r = R * (base + 0.17 * vAbs((i + (sgn > 0 ? 0 : 0.37)) % 1));
          pts.push([Math.cos(th) * r, Math.sin(th) * r]);
        }
        const hue = sgn > 0 ? 196 + t * 7 : 268 + t * 7;
        fogPath(pts, true, hue, 20, .035, 0.05);
        strokePath(pts, true, hue, 1.4, .85);
      }
  }},
  { name: 'roză / floare (r = 1 + sin kθ)', rest: 0.62, draw(t) {
      // petalele coborau spre origine; acum au o rază minimă, deci floarea stă într-un
      // inel și lasă mijlocul liber, ca restul grupului.
      const N = 720, K = 5, pts = [];
      for (let k = 0; k <= N; k++) {
        const i = k / N, th = i * Math.PI * 2;
        const r = R * (0.50 + 0.08 * Math.sin(K * th + t * .6) + 0.15 * vAbs(i));
        pts.push([Math.cos(th) * r, Math.sin(th) * r]);
      }
      fogPath(pts, true, t * 30, 18, .04, 0.04);
      strokePath(pts, true, t * 30, 1.6, .9);
  }},
  { name: 'coroană — inel cu raze scurte pe bași', rest: 0.82, draw(t) {
      // „Fumbling_Foo – Star Forge": inel curat, din care ies raze scurte doar acolo
      // unde banda are energie. Razele pleacă din inel spre exterior, niciodată spre centru.
      const r0 = R * 0.48, N = 96;
      const ring = [];
      for (let i = 0; i <= 200; i++) { const th = i / 200 * Math.PI * 2;
        const r = r0 * (1 + 0.05 * vAbs(i / 200));
        ring.push([Math.cos(th) * r, Math.sin(th) * r]); }
      fogPath(ring, true, 40 + t * 5, 22, .045, 0.03);
      strokePath(ring, true, 40 + t * 5, 1.8, .9);
      for (let k = 0; k < N; k++) {
        const u = k / N, th = u * Math.PI * 2 - t * 0.14;
        const en = Math.pow(eAt((k * 7 % N) / N), 1.3);
        if (en < 0.06) continue;
        const len = R * (0.02 + 0.26 * en);
        strokePath([[Math.cos(th) * r0, Math.sin(th) * r0],
                    [Math.cos(th) * (r0 + len), Math.sin(th) * (r0 + len)]],
                   false, 32 + t * 5 + en * 40, 1.4 + 1.8 * en, .35 + .55 * en);
      }
  }},
  { name: 'arce pe octave — un arc per octavă', rest: 0.76, draw(t) {
      // spectrul rupt în 7 octave; fiecare octavă e un arc care se îngroașă și se
      // împinge în afară pe energia ei. Inelul rămâne o bandă subțire, mereu goală în mijloc.
      const OCT = 7, r0 = R * 0.50;
      for (let o = 0; o < OCT; o++) {
        const en = Math.pow(eAt(Math.pow(2, o) / Math.pow(2, OCT)), 1.1);
        const a0 = (o / OCT) * Math.PI * 2 + t * 0.10;
        const span = (Math.PI * 2 / OCT) * 0.80;
        const pts = [];
        for (let k = 0; k <= 40; k++) {
          const u = k / 40, th = a0 + span * u;
          const r = r0 * (1 + 0.04 + 0.26 * en * Math.sin(u * Math.PI));
          pts.push([Math.cos(th) * r, Math.sin(th) * r]);
        }
        const hue = 190 + o * 24 + t * 6;
        fogPath(pts, false, hue, 18, .04 + .10 * en, 0.04);
        strokePath(pts, false, hue, 1.6 + 2.6 * en, .4 + .55 * en);
      }
  }},
];

// ─────────────────────────── comenzi pe ecran ─────────────────────────
let fIdx = 0;                       // pornim pe cea care respectă cel mai bine criteriul
const FAVS = new Set([0, 1, 3]);    // cele pe care le-a plăcut Victor, marcate cu ★
const chips = document.getElementById('chips');
FORMULAS.forEach((f, i) => {
  const b = document.createElement('button');
  b.className = 'chip' + (i === fIdx ? ' on' : '') + (FAVS.has(i) ? ' fav' : '');
  b.textContent = i + 1;
  b.addEventListener('click', () => pick(i));
  chips.append(b);
});
function pick(i) {
  fIdx = i;
  [...chips.children].forEach((c, k) => c.classList.toggle('on', k === i));
  label.textContent = (i + 1) + ' — ' + FORMULAS[i].name;
  for (const f of fb) f.x.clearRect(0, 0, f.c.width, f.c.height);   // fără urme de la formula veche
  layout();                                                         // fiecare formulă, același diametru
  poke();
}

// comenzile se estompează singure ca să rămână doar halo-ul; o atingere le readuce
let fadeTimer = null;
const ui = document.getElementById('ui');
function poke() {
  ui.classList.remove('faded');
  clearTimeout(fadeTimer);
  fadeTimer = setTimeout(() => ui.classList.add('faded'), 4500);
}
addEventListener('pointerdown', poke);
poke();

// ─────────────────────────────── bucla ────────────────────────────────
layout();
const t0 = performance.now();
(function frame(now) {
  const t = (now - t0) / 1000;
  analyser.getFloatTimeDomainData(wave);
  analyser.getByteFrequencyData(spec);
  updateBands();
  drawBars();
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lctx.clearRect(0, 0, R * 2, R * 2);
  lctx.translate(R, R);
  lctx.globalCompositeOperation = 'lighter';
  FORMULAS[fIdx].draw(t);
  requestAnimationFrame(frame);
})(performance.now());
</script>
