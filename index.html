<!doctype html>
<html lang="ro">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Voice Halo</title>
<style>
  :root {
    --ink: #cfd6de; --dim: #7f8894; --line: #1d242d;
    --pad-b: env(safe-area-inset-bottom, 0px);
    --pad-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #05070a; color: var(--dim);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  body::before {                       /* fundal, ca să se vadă cum compune halo-ul */
    content: ""; position: fixed; inset: 0;
    background: radial-gradient(120vmax 90vmax at 30% 15%, #101b26, #05070a 70%);
  }
  /* pânza: centrată pe ecran, mai lată decât ecranul — vârfurile tari pot ieși afară */
  #wrap { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
          pointer-events: none; mix-blend-mode: screen }
  #wrap canvas { display: block }

  /* ── comenzi ─────────────────────────────────────────────────────────── */
  #ui { position: fixed; inset: 0; display: flex; flex-direction: column;
        justify-content: space-between; padding: calc(var(--pad-t) + 10px) 10px
        calc(var(--pad-b) + 8px); transition: opacity .35s; z-index: 3 }
  #ui.faded { opacity: 0 }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center }
  .chip { flex: 0 0 auto; min-width: 42px; padding: 9px 12px; border-radius: 999px;
          border: 1px solid var(--line); background: rgba(10,14,19,.72); color: var(--dim);
          font: 600 14px/1 ui-monospace, monospace; backdrop-filter: blur(8px) }
  .chip.on { border-color: #3c7fa6; color: #bfe6ff; background: rgba(20,44,60,.8) }
  /* favoritele lui Victor: 5 (spițe pe spectru) și 7 (MilkDrop autentic) */
  .chip.fav::after { content: "★"; font-size: 9px; vertical-align: super; opacity: .75 }
  #bottom { display: flex; flex-direction: column; gap: 8px; align-items: center }
  #label { color: var(--ink); font-size: 12px; text-align: center; padding: 0 8px;
           text-shadow: 0 1px 6px #000 }
  #mic { padding: 13px 20px; border-radius: 999px; border: 1px solid #2f6b8c;
         background: rgba(16,40,56,.85); color: #bfe6ff; font: 600 15px/1 inherit;
         backdrop-filter: blur(8px) }
  #mic.live { border-color: var(--line); background: rgba(10,14,19,.6); color: var(--dim);
              font-weight: 400; font-size: 12px; padding: 7px 14px }
  #mic.bad { border-color: #7a3a33; color: #ff9b8a }
  /* vumetru: o bară per interval de frecvență, grave la stânga, înalte la dreapta */
  #bars { display: flex; align-items: flex-end; gap: 2px; width: 100%; height: 46px }
  #bars div { flex: 1; min-height: 2px; border-radius: 2px 2px 0 0;
              background: linear-gradient(#7fe3ff, #23566f) }
</style>

<div id="wrap"><canvas id="c"></canvas></div>

<div id="ui">
  <div id="chips"></div>
  <div id="bottom">
    <div id="label">apasă pe buton ca să pornești microfonul</div>
    <button id="mic">🎙 pornește microfonul</button>
    <div id="bars"></div>
  </div>
</div>

<script>
// ─────────────────────────────── audio ────────────────────────────────
// Pe telefon getUserMedia cere DOUĂ lucruri: origine https (de aici GitHub Pages)
// și un gest al utilizatorului. iOS mai cere și un actx.resume() în acel gest,
// altfel contextul rămâne suspendat și forma de undă e numai zerouri.
const actx = new (window.AudioContext || window.webkitAudioContext)();
const analyser = actx.createAnalyser();
analyser.fftSize = 2048;
analyser.smoothingTimeConstant = 0.72;
const wave = new Float32Array(analyser.fftSize);
const spec = new Uint8Array(analyser.frequencyBinCount);
let micOn = false;

const micBtn = document.getElementById('mic');
const label  = document.getElementById('label');

async function startMic() {
  if (micOn) return;
  try {
    if (!navigator.mediaDevices) throw new Error('fără mediaDevices (pagina nu e pe https?)');
    await actx.resume();
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
    });
    actx.createMediaStreamSource(stream).connect(analyser);
    micOn = true;
    micBtn.className = 'live';
    micBtn.textContent = '🎙 microfon pornit';
    label.textContent = (fIdx + 1) + ' — ' + FORMULAS[fIdx].name;
    keepAwake();
  } catch (e) {
    micBtn.className = 'bad';
    micBtn.textContent = 'microfon refuzat: ' + (e.name || e.message);
  }
}
micBtn.addEventListener('click', startMic);

// ecranul să nu se stingă cât te uiți la el
async function keepAwake() {
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && micOn) keepAwake();
});

// ── vumetrul: se vede imediat când intră vocea ────────────────────────
const BARS = 36, barEls = [];
{
  const box = document.getElementById('bars');
  for (let i = 0; i < BARS; i++) { const d = document.createElement('div'); box.append(d); barEls.push(d); }
}
function drawBars() {
  // vocea stă jos în spectru, deci benzile grave primesc mai multă lățime (scală pătratică)
  for (let i = 0; i < BARS; i++) {
    const lo = Math.floor(Math.pow(i / BARS, 2) * spec.length);
    const hi = Math.max(lo + 1, Math.floor(Math.pow((i + 1) / BARS, 2) * spec.length));
    let sum = 0; for (let j = lo; j < hi; j++) sum += spec[j];
    barEls[i].style.height = (2 + (sum / (hi - lo) / 255) * 42) + 'px';
  }
}

// ──────────────────────── geometrie / layout ──────────────────────────
// Cerința: cercul de repaus să aibă diametrul = 80% din LĂȚIMEA ecranului.
// Fiecare formulă își desenează inelul la o fracțiune proprie din R (0.42…0.58),
// așa că R nu e „jumătate de ecran": îl calculăm din fracțiunea formulei curente,
// ca toate cele șapte să iasă la același diametru vizibil.
const RING_OF_WIDTH = 0.80;
const canvas = document.getElementById('c');
const lctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
const dpr = Math.min(2, window.devicePixelRatio || 1);   // 2 e destul; 3 doar încinge telefonul
let R = 150;

const fb = [0, 1].map(() => { const c = document.createElement('canvas'); return { c, x: c.getContext('2d') }; });
let fbCur = 0;

function layout() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const wanted = RING_OF_WIDTH * Math.min(vw, vh * 0.92) / 2;   // raza cerută, în px
  R = wanted / FORMULAS[fIdx].rest;                             // deci jumătatea pânzei
  const side = Math.round(R * 2), px = Math.round(side * dpr);
  canvas.style.width = canvas.style.height = side + 'px';
  canvas.width = canvas.height = px;
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  wrap.style.width = wrap.style.height = side + 'px';
  for (const f of fb) { f.c.width = f.c.height = px; }
}
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 250));

// ─────────────── formulele: desenate în coordonate centrate ───────────
// v(i) = eșantionul de undă în [-1,1]; s(i) = spectrul în [0,1].
const v = i => wave[(i * (wave.length - 1)) | 0] || 0;
const s = i => (spec[(i * (spec.length * 0.55)) | 0] || 0) / 255;

function strokePath(pts, close, hue, width, alpha) {
  const x = CTX;
  x.beginPath();
  pts.forEach(([px, py], k) => k ? x.lineTo(px, py) : x.moveTo(px, py));
  if (close) x.closePath();
  x.lineWidth = width; x.lineJoin = 'round'; x.lineCap = 'round';
  x.strokeStyle = `hsla(${hue % 360}, 85%, 62%, ${alpha})`;
  x.shadowColor = `hsla(${hue % 360}, 95%, 60%, .9)`;
  x.shadowBlur = width * 5;
  x.stroke();
  x.shadowBlur = 0;
}

// `rest` = unde stă marginea VIZIBILĂ a efectului, ca fracțiune din R. Pânza se
// scalează din ea, ca toate să iasă la același diametru pe ecran.
//
// Regulile grupului: centrul rămâne LIBER, iar linia pulsează DOAR SPRE EXTERIOR
// (de aceea peste tot |eșantion|, nu eșantionul cu semn).

// ── benzi de spectru: prag de zgomot + tavan lent + răspuns compresiv ────────
// Prima variantă sărea în tavan la orice foșnet: normaliza pe maximul RECENT al
// benzii, deci zgomotul de fond devenea „maxim" în câteva secunde. Acum fiecare
// bandă ține DOUĂ praguri — o podea care urcă lent spre zgomotul de fond și un
// tavan care coboară foarte lent — iar între ele răspunsul e compresiv (^1.7),
// ca vorbitul normal să stea pe la jumătate și abia strigătul să ajungă sus.
const NB = 64;
const peak   = new Float32Array(NB).fill(60);
const floorA = new Float32Array(NB).fill(6);
const band   = new Float32Array(NB);
let levelNow = 0;                    // cât de tare se vorbește acum, 0…1
function updateBands() {
  let sum = 0;
  for (let i = 0; i < NB; i++) {
    const lo = Math.floor(Math.pow(i / NB, 2) * spec.length * 0.85);
    const hi = Math.max(lo + 1, Math.floor(Math.pow((i + 1) / NB, 2) * spec.length * 0.85));
    let acc = 0; for (let j = lo; j < hi; j++) acc += spec[j];
    const val = acc / (hi - lo);
    peak[i]   = Math.max(val, peak[i] * 0.9985);
    floorA[i] = val < floorA[i] ? val : floorA[i] + 0.06;
    const span = Math.max(22, peak[i] - floorA[i]);
    band[i] = Math.pow(Math.max(0, (val - floorA[i] - 2) / span), 1.7);
    sum += band[i];
  }
  const l = Math.min(1, (sum / NB) * 2.4);
  levelNow += (l - levelNow) * (l > levelNow ? 0.35 : 0.06);   // urcă repede, coboară lent
}
const e = i => band[Math.min(NB - 1, Math.max(0, i | 0))] || 0;
const eAt = u => e(u * (NB - 1));

// ── forma inelului: voce când se vorbește, undă proprie când e liniște ───────
// În liniște unda PCM e aproape zero, deci inelele înghețau. Acum, cu cât e mai
// multă liniște, cu atât se amestecă mai tare o undă LENTĂ proprie — nu tremur,
// ci o oscilație amplă și domoală. Peste tot se aplică și o inerție: forma
// desenată urmărește ținta cu întârziere, deci rămâne „un pic în urmă".
const SHAPE_N = 512;
const SHAPE = new Float32Array(SHAPE_N);
let idleMix = 1;                                  // 1 = liniște, 0 = vorbire
function idleWave(u, t) {
  return 0.52 * Math.sin(u * Math.PI * 2 * 3 + t * 0.42)
       + 0.31 * Math.sin(u * Math.PI * 2 * 5 - t * 0.29)
       + 0.17 * Math.sin(u * Math.PI * 2 * 8 + t * 0.19);
}
function updateShape(t) {
  idleMix += ((1 - Math.min(1, levelNow * 1.6)) - idleMix) * 0.04;
  for (let i = 0; i < SHAPE_N; i++) {
    const u = i / SHAPE_N;
    const live = Math.abs(v(u));
    const idle = 0.42 * Math.abs(idleWave(u, t));
    const target = live * (1 - idleMix) + idle * idleMix;
    SHAPE[i] += (target - SHAPE[i]) * 0.12;       // inerția
  }
}
const vs = u => SHAPE[Math.min(SHAPE_N - 1, Math.max(0, (u * SHAPE_N) | 0))] || 0;
const vAbs = vs;                                   // efectele vechi trec prin aceeași formă

// ── unda ruptă în conținut JOS și SUS (folosită de oscilograme) ─────────────
// Criteriul de separare: media alunecătoare a undei e partea GRAVĂ (conturul lent),
// iar ce rămâne după scăderea ei e partea ÎNALTĂ (detaliul rapid, consoanele).
const LOW = new Float32Array(256), HIGH = new Float32Array(256);
function splitWave() {
  const W = 16;
  for (let i = 0; i < 256; i++) {
    const c = (i / 256) * (wave.length - 1) | 0;
    let m = 0;
    for (let k = -W; k <= W; k++) m += wave[Math.min(wave.length - 1, Math.max(0, c + k))];
    m /= (2 * W + 1);
    LOW[i] = m;
    HIGH[i] = wave[c] - m;
  }
}

// ── ceața: aceeași cale, trasă în afară și suflată larg ──────────────────────
let CTX = null;                       // pânza pe care se desenează acum (ecran sau urmă)
function fogPath(pts, close, hue, width, alpha, push) {
  const x = CTX, k = 1 + (push || 0);
  x.beginPath();
  pts.forEach(([px, py], i) => i ? x.lineTo(px * k, py * k) : x.moveTo(px * k, py * k));
  if (close) x.closePath();
  x.lineWidth = width; x.lineJoin = x.lineCap = 'round';
  x.strokeStyle = `hsla(${hue % 360}, 80%, 62%, ${alpha})`;
  x.shadowColor = `hsla(${hue % 360}, 90%, 64%, .85)`;
  x.shadowBlur = width * 2.4;
  x.stroke();
  x.shadowBlur = 0;
}

// ── stratul de urmă: orice efect poate lăsa ceață în spate ───────────────────
// Același truc ca la MilkDrop — cadrul precedent, redesenat puțin mărit și mai
// stins — dar oferit ca strat generic, ca să-l poată folosi și fulgerele, și
// inelele contrarotative, fără să-și rescrie fiecare bucla de feedback.
function trailLayer({ DECAY = 0.90, ZOOM = 1.008, TWIST = 0.002 }, drawFn) {
  const px = fb[0].c.width, half = px / 2;
  const src = fb[fbCur], dst = fb[1 - fbCur];
  dst.x.setTransform(1, 0, 0, 1, 0, 0);
  dst.x.globalCompositeOperation = 'source-over';
  dst.x.clearRect(0, 0, px, px);
  dst.x.save();
  dst.x.globalAlpha = DECAY;
  dst.x.translate(half, half); dst.x.rotate(TWIST); dst.x.scale(ZOOM, ZOOM);
  dst.x.drawImage(src.c, -half, -half, px, px);
  dst.x.restore();

  dst.x.save();
  dst.x.setTransform(dpr, 0, 0, dpr, 0, 0);
  dst.x.translate(R, R);
  dst.x.globalCompositeOperation = 'lighter';
  const prev = CTX; CTX = dst.x;
  drawFn();
  CTX = prev;
  dst.x.restore();

  fbCur = 1 - fbCur;
  lctx.drawImage(fb[fbCur].c, -R, -R, R * 2, R * 2);
}

// ── inelul MilkDrop ──────────────────────────────────────────────────────────
function milkdropRing(t, { ZOOM, TWIST, DECAY, R0, AMP, W, SEGS = 512, HUE = null, SPIN = 0.12 }) {
  const px = fb[0].c.width, half = px / 2;
  const src = fb[fbCur], dst = fb[1 - fbCur];
  dst.x.setTransform(1, 0, 0, 1, 0, 0);
  dst.x.globalCompositeOperation = 'source-over';
  dst.x.clearRect(0, 0, px, px);
  dst.x.save();
  dst.x.globalAlpha = DECAY;
  dst.x.translate(half, half); dst.x.rotate(TWIST); dst.x.scale(ZOOM, ZOOM);
  dst.x.drawImage(src.c, -half, -half, px, px);
  dst.x.restore();

  dst.x.globalCompositeOperation = 'lighter';
  dst.x.strokeStyle = HUE === null ? '#fff' : `hsl(${HUE % 360}, 85%, 70%)`;
  dst.x.lineJoin = dst.x.lineCap = 'round';
  dst.x.beginPath();
  for (let k = 0; k <= SEGS; k++) {
    const i = k / SEGS, th = i * Math.PI * 2 + t * SPIN;   // + = sensul acelor de ceas
    const seam = Math.max(0, (i - 0.9) / 0.1);
    const sample = vAbs(i) * (1 - seam) + vAbs(0) * seam;
    const r = half * (R0 + AMP * sample);
    const x = half + Math.cos(th) * r, y = half + Math.sin(th) * r;
    k ? dst.x.lineTo(x, y) : dst.x.moveTo(x, y);
  }
  dst.x.closePath();
  dst.x.lineWidth = W * 7 * dpr;   dst.x.globalAlpha = 0.045; dst.x.stroke();
  dst.x.lineWidth = W * 2.6 * dpr; dst.x.globalAlpha = 0.11;  dst.x.stroke();
  dst.x.lineWidth = W * dpr;       dst.x.globalAlpha = 0.85;  dst.x.stroke();
  dst.x.globalAlpha = 1;
  fbCur = 1 - fbCur;
  lctx.drawImage(fb[fbCur].c, -R, -R, R * 2, R * 2);
}

// ── orbite de particule (reconstrucția animației din film) ───────────────────
// Dedus din cadrele 0:15–0:23: fiecare fir e un lanț de mărgele pătrate pe un
// PLAN ORBITAL propriu (înclinare + azimut), nu un cerc 2D. Trei lucruri fac
// diferența dintre „seamănă" și „nu seamănă", toate găsite pe cadre consecutive:
//   · adâncimea se normalizează pe amplitudinea Z a FIRULUI, nu global — altfel
//     firele plate nu ajung niciodată la mărimea maximă și totul pare turtit;
//   · numărul de mărgele urmează LUNGIMEA arcului, nu unghiul lui, altfel firele
//     mici se ard într-o panglică albă continuă;
//   · filmul pulsează între inel plat și ghem sferic, iar variabila nu e raza, ci
//     ÎMPRĂȘTIEREA ÎNCLINĂRILOR — aici e legată de cât de tare se vorbește.
const ORB = {
  STRANDS: 14, BEADS_PER_TURN: 110, BEADS_MAX: 170,
  ARC_MIN: 0.55, ARC_MAX: 1.35, COMET_FRACTION: 0.34, COMET_RADIUS_BOOST: 1.16,
  TILT_MIN_DEG: 6, TILT_MAX_DEG: 58, TILT_CAP_DEG: 72,
  RADIUS_SPREAD: 0.30, WOBBLE: 0.055, WOBBLE_LOBES: 3,
  PERSPECTIVE: 2.7, RING_FRAC: 0.30, HOLE_FRAC: 0.56, HOLE_SOFT: 0.30, INNER_FADE: 0.34,
  DOT_NEAR: 7.6, DOT_FAR: 2.4, TAPER: 0.62,
  GLOW_NEAR: 1.45, GLOW_FAR: 2.2, GLOW_A_NEAR: 0.22, GLOW_A_FAR: 0.20,
  CORE_A_NEAR: 0.82, CORE_A_FAR: 0.42,
  CYAN: [45, 200, 255], MAGENTA: [238, 72, 214], VIOLET: [138, 74, 248], STEPS: 17,
  IDLE_SPIN: 0.052, SPIN_VAR: 0.55, RETRO: 0.23, PRECESS: 0.021,
  BREATH_RATE: 0.045, BREATH_AMT: 0.16,
  A_SPIN: 2.6, A_RADIUS: 0.15, A_SIZE: 0.50, A_BRIGHT: 0.40, A_TILT: 0.55,
  PULSE_AMP: 0.10, PULSE_LOBES: 2, PULSE_SPEED: 1.35,
  BLOOM_TIGHT: 5, BLOOM_WIDE: 16, BLOOM_G_TIGHT: 0.40, BLOOM_G_WIDE: 1.05,
};
const TAU = Math.PI * 2;
const orbMix = (a, b, k) => [a[0]+(b[0]-a[0])*k, a[1]+(b[1]-a[1])*k, a[2]+(b[2]-a[2])*k];
const orbRGB = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function orbRamp(k) {                       // 0 = cyan … 1 = magenta, cu mijloc violet
  const q = Math.sign(k - 0.5) * Math.pow(Math.abs(2 * k - 1), 0.42);
  const u = 0.5 + 0.5 * q;
  return u < 0.5 ? orbMix(ORB.CYAN, ORB.VIOLET, u * 2)
                 : orbMix(ORB.VIOLET, ORB.MAGENTA, (u - 0.5) * 2);
}
const orbSprites = [];
function orbBuildSprites() {
  orbSprites.length = 0;
  for (let i = 0; i < ORB.STEPS; i++) {
    const c = orbRamp(i / (ORB.STEPS - 1));
    const BS = 96, blob = document.createElement('canvas');
    blob.width = blob.height = BS;
    const bg = blob.getContext('2d');
    const g = bg.createRadialGradient(BS/2, BS/2, 0, BS/2, BS/2, BS/2);
    g.addColorStop(0, orbRGB(orbMix(c, [255,255,255], .4), 1));
    g.addColorStop(.16, orbRGB(c, .88)); g.addColorStop(.40, orbRGB(c, .26));
    g.addColorStop(.72, orbRGB(c, .05)); g.addColorStop(1, orbRGB(c, 0));
    bg.fillStyle = g; bg.fillRect(0, 0, BS, BS);
    const SS = 48, sq = document.createElement('canvas');
    sq.width = sq.height = SS;
    const sc = sq.getContext('2d'), pad = SS * .10, rr = SS * .15;
    sc.fillStyle = orbRGB(c, 1);
    sc.beginPath(); sc.roundRect(pad, pad, SS - 2*pad, SS - 2*pad, rr); sc.fill();
    const fg = sc.createLinearGradient(SS*.2, SS*.2, SS*.85, SS*.85);
    fg.addColorStop(0, orbRGB(orbMix(c, [255,255,255], .12), .95));
    fg.addColorStop(1, orbRGB(orbMix(c, [255,255,255], .10), .35));
    sc.fillStyle = fg;
    sc.beginPath(); sc.roundRect(SS*.26, SS*.26, SS*.48, SS*.48, rr*.8); sc.fill();
    orbSprites.push({ blob, sq });
  }
}
const orbStrands = [];
function orbBuild() {
  orbStrands.length = 0;
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < ORB.STRANDS; i++) {
    const u = i / ORB.STRANDS;
    const comet = ((i * 0.8090169944) % 1) < ORB.COMET_FRACTION;
    const arc = TAU * (comet ? ORB.ARC_MIN + 0.25 * ((i * 0.4142) % 1)
                             : 0.95 + (ORB.ARC_MAX - 0.95) * ((i * 0.2718) % 1));
    const jit = (i * 0.6180339887) % 1;
    const radius = (1 + ORB.RADIUS_SPREAD * (((i * 0.7548776662) % 1) * 2 - 1))
                   * (comet ? ORB.COMET_RADIUS_BOOST : 1);
    const hueFrom = (i % 2 === 0) ? 0.02 + 0.16 * jit : 0.98 - 0.16 * jit;
    const hueSpan = (0.30 + 0.06 * ((i * 0.3819) % 1)) * (i % 2 === 0 ? 1 : -1);
    orbStrands.push({
      hueFrom, hueSpan, comet, arc, radius,
      family: hueFrom + hueSpan * 0.5 < 0.5 ? 0 : 1,
      beads: Math.min(ORB.BEADS_MAX, Math.max(12,
              Math.round(ORB.BEADS_PER_TURN * (arc / TAU) * radius))),
      azimuth: i * GOLDEN + u * 0.6,
      tiltBase: (ORB.TILT_MIN_DEG + (ORB.TILT_MAX_DEG - ORB.TILT_MIN_DEG) * jit) * Math.PI / 180,
      tiltPhase: u * TAU, wobblePh: u * TAU * 1.7,
      spin: (ORB.IDLE_SPIN * (1 + ORB.SPIN_VAR * (((i * 0.3301) % 1) * 2 - 1)))
            * ((i * 0.5391) % 1 < ORB.RETRO ? -1 : 1),
      theta: u * TAU * 1.3,
    });
  }
}
orbBuildSprites(); orbBuild();

const orbScene = document.createElement('canvas'), orbSC = orbScene.getContext('2d');
const orbMipA = document.createElement('canvas'), orbMA = orbMipA.getContext('2d');
const orbMipB = document.createElement('canvas'), orbMB = orbMipB.getContext('2d');
let orbLast = 0;
function orbSize(px) {
  if (orbScene.width === px) return;
  orbScene.width = orbScene.height = px;
  orbMipA.width = orbMipA.height = Math.max(1, Math.round(px / ORB.BLOOM_TIGHT));
  orbMipB.width = orbMipB.height = Math.max(1, Math.round(px / ORB.BLOOM_WIDE));
  for (const c of [orbSC, orbMA, orbMB]) { c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'low'; }
}
function drawOrbits(t) {
  const px = Math.round(R * 2 * dpr);
  orbSize(px);
  const dt = Math.min(0.05, orbLast ? t - orbLast : 0.016); orbLast = t;
  const cx = px / 2, cy = px / 2;
  let bass = 0, treble = 0;
  for (let i = 0; i < NB / 3; i++) bass += band[i];
  for (let i = (NB * 2 / 3) | 0; i < NB; i++) treble += band[i];
  bass /= (NB / 3); treble /= (NB / 3);
  const level = levelNow;

  const R0 = px * ORB.RING_FRAC * (1 + ORB.A_RADIUS * level);
  const holeR = R0 * ORB.HOLE_FRAC, F = ORB.PERSPECTIVE;
  const dotNear = ORB.DOT_NEAR * dpr * (1 + ORB.A_SIZE * level);
  const dotFar  = ORB.DOT_FAR  * dpr * (1 + ORB.A_SIZE * level * .5);
  const bright  = 1 + ORB.A_BRIGHT * level;

  orbSC.setTransform(1, 0, 0, 1, 0, 0);
  orbSC.clearRect(0, 0, px, px);
  orbSC.globalCompositeOperation = 'lighter';
  const spinMul = 1 + ORB.A_SPIN * level;

  for (const st of orbStrands) {
    const famDrive = st.family === 0 ? 1 + 0.55 * treble : 1 + 0.55 * bass;
    st.theta += st.spin * spinMul * famDrive * dt;
    const azim = st.azimuth + ORB.PRECESS * t * (st.family === 0 ? 1 : -0.7);
    const tilt = st.tiltBase
               * (1 + ORB.BREATH_AMT * Math.sin(t * ORB.BREATH_RATE * TAU + st.tiltPhase))
               * (1 + ORB.A_TILT * level);
    const tc = Math.min(tilt, ORB.TILT_CAP_DEG * Math.PI / 180);
    const ca = Math.cos(azim), sa = Math.sin(azim), ct = Math.cos(tc), stt = Math.sin(tc);
    const N = st.beads;
    for (let i = 0; i < N; i++) {
      const u = i / (N - 1), th = st.theta + u * st.arc;
      let rr = R0 * st.radius * (1 + ORB.WOBBLE * Math.sin(ORB.WOBBLE_LOBES * th + st.wobblePh));
      rr += R0 * ORB.PULSE_AMP * level
            * (0.5 + 0.5 * Math.sin(ORB.PULSE_LOBES * th - t * ORB.PULSE_SPEED * TAU));
      const cth = Math.cos(th), sth = Math.sin(th);
      const x3 = rr * (cth * ca + sth * (-sa * ct));
      const y3 = rr * (cth * sa + sth * (ca * ct));
      const z3 = rr * (sth * stt);
      const zn = z3 / R0, persp = F / (F - zn);
      const zAmp = Math.max(0.12, stt * st.radius);
      const depth = Math.min(1, Math.max(0, (zn / zAmp + 1) * 0.5));
      let X = x3 * persp, Y = y3 * persp;
      const d = Math.hypot(X, Y);
      if (d < holeR * (1 + ORB.HOLE_SOFT)) {           // nimic nu intră în gaură
        const target = holeR * (1 + ORB.HOLE_SOFT * (d / (holeR * (1 + ORB.HOLE_SOFT))));
        const k = target / Math.max(d, 1e-3); X *= k; Y *= k;
      }
      const dist = Math.hypot(X, Y);
      const innerFade = Math.min(1, Math.max(0, (dist - holeR) / (holeR * ORB.INNER_FADE)));
      if (innerFade <= 0.001) continue;
      const taper = st.comet
        ? Math.pow(u, 0.45) * (1 - ORB.TAPER * Math.pow(1 - u, 1.4))
        : 1 - ORB.TAPER * 0.45 * Math.pow(Math.abs(2 * u - 1), 2.2);
      const size = (dotFar + (dotNear - dotFar) * Math.pow(depth, 1.35)) * taper;
      if (size < 0.35) continue;
      let hue = st.hueFrom + st.hueSpan * u; hue -= Math.floor(hue);
      const spr = orbSprites[Math.min(ORB.STEPS - 1, (hue * ORB.STEPS) | 0)];
      const glowA = (ORB.GLOW_A_FAR + (ORB.GLOW_A_NEAR - ORB.GLOW_A_FAR) * depth) * taper * bright * innerFade;
      const coreA = (ORB.CORE_A_FAR + (ORB.CORE_A_NEAR - ORB.CORE_A_FAR) * Math.pow(depth, 1.6)) * taper * bright * innerFade;
      const gm = (depth > 0.5 ? ORB.GLOW_NEAR : ORB.GLOW_FAR) * size;
      orbSC.globalAlpha = Math.min(1, glowA);
      orbSC.drawImage(spr.blob, cx + X - gm / 2, cy + Y - gm / 2, gm, gm);
      orbSC.globalAlpha = Math.min(1, coreA);
      orbSC.drawImage(spr.sq, cx + X - size / 2, cy + Y - size / 2, size, size);
    }
  }
  orbSC.globalAlpha = 1;

  // bloom ieftin: două nivele de mip, în loc de ctx.filter (de ~4× mai scump)
  orbMA.clearRect(0, 0, orbMipA.width, orbMipA.height);
  orbMA.drawImage(orbScene, 0, 0, orbMipA.width, orbMipA.height);
  orbMB.clearRect(0, 0, orbMipB.width, orbMipB.height);
  orbMB.drawImage(orbScene, 0, 0, orbMipB.width, orbMipB.height);

  lctx.save();
  lctx.translate(-R, -R);
  lctx.globalCompositeOperation = 'lighter';
  lctx.globalAlpha = ORB.BLOOM_G_WIDE;  lctx.drawImage(orbMipB, 0, 0, R * 2, R * 2);
  lctx.globalAlpha = ORB.BLOOM_G_TIGHT; lctx.drawImage(orbMipA, 0, 0, R * 2, R * 2);
  lctx.globalAlpha = 1;                 lctx.drawImage(orbScene, 0, 0, R * 2, R * 2);
  lctx.restore();
}

// vârf stins: segmentul se pierde pe ultimele 25% din lungime, în loc să se taie brusc
function spike(ax, ay, bx, by, hue, width, alpha) {
  const x = CTX;
  const g = x.createLinearGradient(ax, ay, bx, by);
  g.addColorStop(0.00, `hsla(${hue % 360}, 85%, 62%, ${alpha})`);
  g.addColorStop(0.75, `hsla(${hue % 360}, 85%, 62%, ${alpha})`);
  g.addColorStop(1.00, `hsla(${hue % 360}, 85%, 62%, 0)`);
  x.beginPath(); x.moveTo(ax, ay); x.lineTo(bx, by);
  x.lineWidth = width; x.lineCap = 'butt';
  x.strokeStyle = g;
  x.shadowColor = `hsla(${hue % 360}, 95%, 60%, .9)`;
  x.shadowBlur = width * 2.2;
  x.stroke();
  x.shadowBlur = 0; x.lineCap = 'round';
}

const FORMULAS = [
  { name: 'MilkDrop strâns — lent, cu inerție, se rotește', rest: 0.66, draw(t) {
      // rotația vizibilă a întregului desen, în sensul acelor de ceasornic
      milkdropRing(t, { ZOOM: 1.006, TWIST: 0.004, DECAY: 0.88, R0: 0.52, AMP: 0.26,
                        W: 1.1, SPIN: 0.30 });
  }},
  { name: 'sârmă poligonală — buclă zimțată, linie groasă', rest: 0.70, draw(t) {
      milkdropRing(t, { ZOOM: 1.009, TWIST: -0.004, DECAY: 0.89, R0: 0.52, AMP: 0.24,
                        W: 2.0, SEGS: 30, HUE: 205, SPIN: 0.12 });
  }},
  { name: 'oscilogramă dublă — grav albastru / înalt roșu', rest: 0.68, draw(t) {
      // albastrul urmărește media alunecătoare a undei (partea gravă), roșul ce
      // rămâne după scăderea ei (consoanele). În liniște amândouă respiră pe unda proprie.
      splitWave();
      trailLayer({ DECAY: 0.86, ZOOM: 1.006, TWIST: 0.0015 }, () => {
        for (const kind of [0, 1]) {
          const src = kind ? HIGH : LOW;
          const gain = kind ? 2.6 : 1.0;
          const base = kind ? 0.50 : 0.545;
          const hue  = kind ? 352 : 208;
          const pts = [], N = 256;
          for (let i = 0; i <= N; i++) {
            const u = (i % N) / N;
            const th = u * Math.PI * 2 + t * (kind ? -0.10 : 0.10);
            const live = Math.min(1, Math.abs(src[i % N]) * gain);
            const amp = live * (1 - idleMix) + vs(u) * 1.6 * idleMix;
            const r = R * (base + 0.16 * amp);
            pts.push([Math.cos(th) * r, Math.sin(th) * r]);
          }
          fogPath(pts, true, hue, 16, .05, 0.03);
          strokePath(pts, true, hue, 1.6, .9);
        }
      });
  }},
  { name: 'oscilogramă mov — albastrul și roșul suprapuse', rest: 0.66, draw(t) {
      // Ca să IASĂ mov, cele două trebuie să se suprapună, nu să stea pe raze
      // diferite: aceeași rază de repaus, aceeași grosime mare, doar modulația
      // diferă. Peste tot unde coincid, aditivul le duce în violet, iar unde una
      // sare peste cealaltă rămâne albastru curat sau roșu curat.
      splitWave();
      trailLayer({ DECAY: 0.84, ZOOM: 1.007, TWIST: 0.002 }, () => {
        for (const kind of [0, 1]) {
          const src = kind ? HIGH : LOW;
          const gain = kind ? 2.4 : 1.1;
          const hue  = kind ? 348 : 214;
          const pts = [], N = 256;
          for (let i = 0; i <= N; i++) {
            const u = (i % N) / N;
            const th = u * Math.PI * 2 + t * (kind ? -0.06 : 0.06);
            const live = Math.min(1, Math.abs(src[i % N]) * gain);
            const amp = live * (1 - idleMix) + vs(u) * 1.5 * idleMix;
            const r = R * (0.52 + 0.15 * amp);           // ACEEAȘI rază de repaus
            pts.push([Math.cos(th) * r, Math.sin(th) * r]);
          }
          fogPath(pts, true, hue, 26, .05, 0.02);
          strokePath(pts, true, hue, 4.2, .62);           // groase, ca să se amestece
        }
      });
  }},
  { name: 'coroană — bare de lățime fixă, mereu prezente', rest: 0.66, draw(t) {
      // barele creșteau și în lățime: acum lățimea e fixă și doar înălțimea
      // răspunde. Și există mereu un rând de segmente, chiar și în liniște.
      const r0 = R * 0.48, N = 96, WIDTH = 3.4;
      const ring = [];
      for (let i = 0; i <= 200; i++) { const th = i / 200 * Math.PI * 2;
        const r = r0 * (1 + 0.05 * vs(i / 200));
        ring.push([Math.cos(th) * r, Math.sin(th) * r]); }
      fogPath(ring, true, 40 + t * 5, 22, .045, 0.03);
      strokePath(ring, true, 40 + t * 5, 1.8, .9);
      for (let k = 0; k < N; k++) {
        const u = k / N, th = u * Math.PI * 2 - t * 0.14;
        const en = eAt((k * 7 % N) / N);
        const len = R * (0.022 + 0.087 * en);             // 0.022 = bara de repaus
        const hue = 32 + t * 5 + en * 40;
        spike(Math.cos(th) * r0, Math.sin(th) * r0,
              Math.cos(th) * (r0 + len), Math.sin(th) * (r0 + len),
              hue, WIDTH, .40 + .5 * en);
      }
  }},
  { name: 'spițe pe spectru — dese, groase, cu vârf stins', rest: 0.62, draw(t) {
      // de două ori mai multe spițe (distanța scade cu 50%), de două ori mai groase,
      // cu vârful stins pe ultimele 25%. Pauzele dintre semicercuri erau zone moarte
      // supărătoare — au rămas ~2°, cât să se citească despărțirea.
      const r0 = R * 0.46, GAP = 0.04, REST = 0.016, M = NB * 2;
      for (const side of [0, 1]) {
        for (let k = 0; k < M; k++) {
          const u = k / (M - 1);
          const th = (side ? Math.PI : 0) + GAP / 2 + u * (Math.PI - GAP) + t * 0.06;
          const en = eAt(u);
          const len = R * (REST + 0.10 * en);
          const hue = 190 + u * 170 + t * 8;
          spike(Math.cos(th) * r0, Math.sin(th) * r0,
                Math.cos(th) * (r0 + len), Math.sin(th) * (r0 + len),
                hue, 4.0, .45 + .5 * en);
        }
      }
      const ring = [];
      for (let k = 0; k <= 180; k++) { const th = k / 180 * Math.PI * 2;
        ring.push([Math.cos(th) * r0, Math.sin(th) * r0]); }
      strokePath(ring, true, 200 + t * 8, 1, .30);
  }},
  { name: 'inel de segmente — fără linie, fără goluri', rest: 0.64, draw(t) {
      // varianta din poză: niciun cerc continuu, niciun gol — doar un rând de
      // segmente scurte de jur împrejur, vizibile tot timpul, care se alungesc
      // pe voce. Culoarea curge lin pe circumferință (mov → roz → galben → albastru).
      const r0 = R * 0.50, M = 150, REST = 0.020;
      for (let k = 0; k < M; k++) {
        const u = k / M, th = u * Math.PI * 2 + t * 0.10;
        const en = eAt((u * 2) % 1);
        const len = R * (REST + 0.115 * en);
        const hue = 250 + 170 * u + t * 6;
        spike(Math.cos(th) * r0, Math.sin(th) * r0,
              Math.cos(th) * (r0 + len), Math.sin(th) * (r0 + len),
              hue, 3.6, .55 + .4 * en);
      }
  }},
  { name: 'lanț de fulgere — neon îndreptat spre exterior', rest: 0.74, draw(t) {
      // ceața nu mai bate și spre interior: traseul ei e împins în afară exact cu
      // jumătate din propria lățime, deci marginea ei interioară stă fix pe fulger.
      // În golurile dintre arce rămâne un halou tot spre exterior, care vibrează pe voce.
      trailLayer({ DECAY: 0.74, ZOOM: 1.012, TWIST: 0.0025 }, () => {
        const M = 7, SEG = 20, r0 = R * 0.54;
        const outward = w => w / (2 * R * 0.54);        // ceață doar în afară
        for (let m = 0; m < M; m++) {
          const a0 = (m / M) * Math.PI * 2 + t * 0.20;
          const span = (Math.PI * 2 / M) * 0.80;
          const pts = [];
          for (let k = 0; k <= SEG; k++) {
            const u = k / SEG, th = a0 + span * u;
            const j = vs((m * SEG + k) / (M * SEG));
            const r = r0 * (1 + 0.17 * j + 0.02 * Math.sin(t * 3.1 + m * 1.7));
            pts.push([Math.cos(th) * r, Math.sin(th) * r]);
          }
          const hue = 195 + m * 6 + t * 12;
          fogPath(pts, false, hue, 40, .022, outward(40));
          fogPath(pts, false, hue, 18, .040, outward(18));
          strokePath(pts, false, hue, 3.4, .92);
          // haloul din gol: un arc scurt, doar în afară, care pulsează pe voce
          const gapPts = [];
          for (let k = 0; k <= 8; k++) {
            const th = a0 + span + (Math.PI * 2 / M) * 0.20 * (k / 8);
            gapPts.push([Math.cos(th) * r0, Math.sin(th) * r0]);
          }
          fogPath(gapPts, false, hue + 20, 26, .03 + .10 * levelNow, outward(26));
        }
      });
  }},
  { name: 'orbite de particule — reconstrucția din film', rest: 1.00, draw(t) {
      drawOrbits(t);
  }},
  { name: 'inel dublu contrarotativ — lent, cu ceață', rest: 0.70, draw(t) {
      trailLayer({ DECAY: 0.79, ZOOM: 1.014, TWIST: 0.001 }, () => {
        for (const sgn of [1, -1]) {
          const N = 320, pts = [];
          const base = 0.50 + (sgn > 0 ? 0.045 : 0);
          for (let k = 0; k <= N; k++) {
            const i = k / N, th = i * Math.PI * 2 + sgn * t * 0.10;
            const r = R * (base + 0.17 * vs((i + (sgn > 0 ? 0 : 0.37)) % 1));
            pts.push([Math.cos(th) * r, Math.sin(th) * r]);
          }
          const hue = sgn > 0 ? 196 + t * 7 : 268 + t * 7;
          fogPath(pts, true, hue, 22, .028, 0.05);
          strokePath(pts, true, hue, 1.5, .85);
        }
      });
  }},
];

// ─────────────────────────── comenzi pe ecran ─────────────────────────
let fIdx = 0;                       // pornim pe cea care respectă cel mai bine criteriul
const FAVS = new Set([0, 1, 4, 7]); // cele lăudate la ultimul review, marcate cu ★
const chips = document.getElementById('chips');
FORMULAS.forEach((f, i) => {
  const b = document.createElement('button');
  b.className = 'chip' + (i === fIdx ? ' on' : '') + (FAVS.has(i) ? ' fav' : '');
  b.textContent = i + 1;
  b.addEventListener('click', () => pick(i));
  chips.append(b);
});
function pick(i) {
  fIdx = i;
  [...chips.children].forEach((c, k) => c.classList.toggle('on', k === i));
  label.textContent = (i + 1) + ' — ' + FORMULAS[i].name;
  for (const f of fb) f.x.clearRect(0, 0, f.c.width, f.c.height);   // fără urme de la formula veche
  layout();                                                         // fiecare formulă, același diametru
  poke();
}

// comenzile se estompează singure ca să rămână doar halo-ul; o atingere le readuce
let fadeTimer = null;
const ui = document.getElementById('ui');
function poke() {
  ui.classList.remove('faded');
  clearTimeout(fadeTimer);
  fadeTimer = setTimeout(() => ui.classList.add('faded'), 4500);
}
addEventListener('pointerdown', poke);
poke();

// ─────────────────────────────── bucla ────────────────────────────────
layout();
const t0 = performance.now();
(function frame(now) {
  const t = (now - t0) / 1000;
  analyser.getFloatTimeDomainData(wave);
  analyser.getByteFrequencyData(spec);
  updateBands();
  updateShape(t);
  drawBars();
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  lctx.clearRect(0, 0, R * 2, R * 2);
  lctx.translate(R, R);
  lctx.globalCompositeOperation = 'lighter';
  CTX = lctx;
  FORMULAS[fIdx].draw(t);
  requestAnimationFrame(frame);
})(performance.now());
